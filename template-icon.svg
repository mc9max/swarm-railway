<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d29"/>
      <stop offset="1" stop-color="#2b3050"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- hexagonal swarm cluster: one lead node + ring of worker nodes -->
  <g stroke="#8b93ff" stroke-width="5" fill="#1f2438">
    <!-- worker ring -->
    <circle cx="128" cy="58" r="17"/>
    <circle cx="190" cy="93" r="17"/>
    <circle cx="190" cy="163" r="17"/>
    <circle cx="128" cy="198" r="17"/>
    <circle cx="66" cy="163" r="17"/>
    <circle cx="66" cy="93" r="17"/>
    <!-- connections -->
    <g stroke-width="4" opacity="0.85">
      <line x1="128" y1="58" x2="190" y2="93"/>
      <line x1="190" y1="93" x2="190" y2="163"/>
      <line x1="190" y1="163" x2="128" y2="198"/>
      <line x1="128" y1="198" x2="66" y2="163"/>
      <line x1="66" y1="163" x2="66" y2="93"/>
      <line x1="66" y1="93" x2="128" y2="58"/>
      <line x1="128" y1="58" x2="128" y2="128"/>
      <line x1="190" y1="93" x2="128" y2="128"/>
      <line x1="190" y1="163" x2="128" y2="128"/>
      <line x1="128" y1="198" x2="128" y2="128"/>
      <line x1="66" y1="163" x2="128" y2="128"/>
      <line x1="66" y1="93" x2="128" y2="128"/>
    </g>
  </g>
  <!-- lead bot node -->
  <circle cx="128" cy="128" r="30" fill="#8b93ff"/>
  <circle cx="118" cy="122" r="5" fill="#1a1d29"/>
  <circle cx="138" cy="122" r="5" fill="#1a1d29"/>
  <rect x="115" y="136" width="26" height="7" rx="3.5" fill="#1a1d29"/>
</svg>